<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Trade Setup — Ordyn</title>
  <meta name="description" content="Follow this trade setup in the Ordyn app.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0B0E11;
      --surface: #111419;
      --border: #1A1F28;
      --amber: #F59E0B;
      --cyan: #22D3EE;
      --profit: #00FF88;
      --loss: #FF4D4D;
      --text: #FFFFFF;
      --text-secondary: #A3A3A3;
      --text-dim: #666;
      --muted: #2A3040;
    }
    html { scroll-behavior: smooth; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    .card {
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border-radius: 16px;
      border: 1px solid var(--border);
      overflow: hidden;
      margin-top: 20px;
    }
    .top-line { height: 3px; background: var(--amber); }
    .top-glow {
      height: 80px;
      background: linear-gradient(180deg, rgba(245,158,11,0.12) 0%, rgba(245,158,11,0.03) 60%, transparent 100%);
      margin-top: -3px;
      padding-top: 3px;
    }

    .pair-block { padding: 20px 20px 8px; }
    .pair-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
    .pair-name { font-size: 26px; font-weight: 900; letter-spacing: -0.5px; }
    .dir-chip {
      border: 1px solid;
      border-radius: 4px;
      padding: 2px 8px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
    }
    .dir-long { color: var(--profit); border-color: rgba(0,255,136,0.35); }
    .dir-short { color: var(--loss); border-color: rgba(255,77,77,0.35); }
    .lev-label { color: var(--cyan); font-size: 12px; font-weight: 700; }
    .setup-badge {
      display: flex; align-items: center; gap: 5px;
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid rgba(245,158,11,0.35);
      margin-left: auto;
    }
    .setup-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
    .setup-text { font-size: 9px; font-weight: 800; letter-spacing: 1.5px; color: var(--amber); }

    .pattern-section { padding: 0 20px; margin-top: 8px; }
    .pattern-row { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; }
    .pattern-icon { font-size: 10px; opacity: 0.5; }
    .pattern-name { font-size: 12px; font-weight: 600; letter-spacing: 0.5px; opacity: 0.8; }
    .pattern-badge {
      border-radius: 4px;
      padding: 1px 5px;
      font-size: 9px;
      font-weight: 700;
    }

    .zone-hero {
      margin: 16px 20px;
      padding: 16px;
      border-radius: 12px;
      background: #0D1017;
      border: 1px solid rgba(245,158,11,0.13);
    }
    .zone-title { color: rgba(245,158,11,0.67); font-size: 9px; font-weight: 700; letter-spacing: 2px; margin-bottom: 10px; }
    .zone-track { height: 8px; border-radius: 4px; background: var(--border); position: relative; margin-bottom: 8px; }
    .zone-fill { position: absolute; top: 0; bottom: 0; background: rgba(245,158,11,0.35); border-radius: 4px; }
    .zone-prices { display: flex; justify-content: space-between; }
    .zone-price { color: var(--text-dim); font-size: 12px; font-weight: 700; }

    .sl-tp-row { display: flex; align-items: center; padding: 0 20px; margin-bottom: 12px; }
    .sl-tp-cell { flex: 1; }
    .sl-tp-cell.end { text-align: right; }
    .sl-tp-label { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; }
    .sl-value { color: var(--loss); font-size: 14px; font-weight: 700; margin-top: 2px; }
    .tp-value { color: var(--profit); font-size: 14px; font-weight: 700; margin-top: 2px; }
    .rr-cell { flex: 1; text-align: center; }
    .rr-bar { display: flex; height: 4px; border-radius: 2px; overflow: hidden; width: 80%; margin: 0 auto 4px; }
    .rr-risk { background: rgba(255,77,77,0.53); }
    .rr-reward { background: rgba(0,255,136,0.53); }
    .rr-label { color: var(--text-dim); font-size: 11px; font-weight: 700; }

    .tp-extra-row { display: flex; padding: 0 20px; margin-bottom: 12px; gap: 8px; }
    .tp-extra-cell { flex: 1; text-align: center; }
    .tp-extra-label { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; }
    .tp-extra-value { color: var(--profit); font-size: 12px; font-weight: 600; margin-top: 2px; }

    .metrics-grid { display: flex; padding: 0 20px; margin-bottom: 12px; gap: 8px; }
    .metric-cell {
      flex: 1;
      background: #0D1017;
      border-radius: 8px;
      padding: 8px;
      text-align: center;
      border: 1px solid var(--border);
    }
    .metric-label { color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: 1.5px; }
    .metric-value { color: #B0B8C4; font-size: 13px; font-weight: 700; margin-top: 2px; }

    .conviction-row { display: flex; align-items: center; gap: 8px; padding: 0 20px; margin-bottom: 16px; }
    .conviction-label { color: var(--muted); font-size: 9px; font-weight: 700; letter-spacing: 1.5px; }
    .conviction-dots { display: flex; gap: 2px; }
    .conviction-dot { font-size: 14px; color: #222; }
    .conviction-dot.filled { }
    .conviction-value { font-size: 10px; font-weight: 800; letter-spacing: 1px; }

    .actions {
      width: 100%;
      max-width: 400px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .open-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(90deg, rgba(245,158,11,0.85), var(--amber));
      color: var(--bg);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1px;
      padding: 16px;
      border-radius: 14px;
      border: none;
      cursor: pointer;
      text-decoration: none;
      transition: transform 0.1s;
    }
    .open-btn:active { transform: scale(0.97); }

    .fallback { text-align: center; margin-top: 16px; }
    .fallback-text { color: var(--text-dim); font-size: 13px; margin-bottom: 12px; }
    .store-links { display: flex; justify-content: center; gap: 16px; }
    .store-link {
      color: var(--cyan);
      font-size: 13px;
      font-weight: 600;
      text-decoration: none;
      padding: 8px 16px;
      border: 1px solid rgba(34,211,238,0.3);
      border-radius: 8px;
      transition: background 0.2s;
    }
    .store-link:hover { background: rgba(34,211,238,0.08); }

    .footer {
      margin-top: 40px;
      text-align: center;
      opacity: 0.4;
    }
    .footer-brand { font-family: 'Space Grotesk', sans-serif; font-size: 18px; font-weight: 700; color: var(--cyan); letter-spacing: 3px; }
    .footer-tagline { font-size: 10px; color: var(--text-dim); font-style: italic; margin-top: 4px; }

    .loading { text-align: center; margin-top: 40vh; color: var(--text-dim); font-size: 14px; }

    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="top-line"></div>
    <div class="top-glow">
      <div class="pair-block">
        <div class="pair-row">
          <span class="pair-name" id="pair">—</span>
          <span class="dir-chip" id="dirChip">—</span>
          <span class="lev-label" id="levLabel"></span>
          <div class="setup-badge">
            <div class="setup-dot"></div>
            <span class="setup-text">TRADE SETUP</span>
          </div>
        </div>
      </div>
    </div>

    <div class="pattern-section hidden" id="patternSection">
      <div class="pattern-row">
        <span class="pattern-icon" id="patternIcon">&#9670;</span>
        <span class="pattern-name" id="patternName"></span>
      </div>
    </div>

    <div class="zone-hero hidden" id="zoneSection">
      <div class="zone-title">ENTRY ZONE</div>
      <div class="zone-track">
        <div class="zone-fill" id="zoneFill" style="left:20%;width:60%"></div>
      </div>
      <div class="zone-prices">
        <span class="zone-price" id="zoneMin">—</span>
        <span class="zone-price" id="zoneMax">—</span>
      </div>
    </div>

    <div class="sl-tp-row hidden" id="slTpRow">
      <div class="sl-tp-cell" id="slCell">
        <div class="sl-tp-label">SL</div>
        <div class="sl-value" id="slValue">—</div>
      </div>
      <div class="rr-cell hidden" id="rrCell">
        <div class="rr-bar">
          <div class="rr-risk" id="rrRisk" style="flex:1"></div>
          <div class="rr-reward" id="rrReward" style="flex:1"></div>
        </div>
        <div class="rr-label" id="rrLabel">—</div>
      </div>
      <div class="sl-tp-cell end" id="tpCell">
        <div class="sl-tp-label" id="tpLabel">TP</div>
        <div class="tp-value" id="tpValue">—</div>
      </div>
    </div>

    <div class="tp-extra-row hidden" id="tpExtraRow"></div>

    <div class="metrics-grid hidden" id="metricsGrid"></div>

    <div class="conviction-row hidden" id="convictionRow">
      <span class="conviction-label">CONVICTION</span>
      <div class="conviction-dots" id="convictionDots"></div>
      <span class="conviction-value" id="convictionValue"></span>
    </div>
  </div>

  <div class="actions">
    <a class="open-btn" id="openBtn" href="#">FOLLOW IN ORDYN</a>
    <div class="fallback">
      <div class="fallback-text">Don't have the app?</div>
      <div class="store-links">
        <a class="store-link" href="https://play.google.com/store/apps/details?id=com.fermion.ordyn" target="_blank">Google Play</a>
        <a class="store-link" href="https://apps.apple.com/app/ordyn/id6742314938" target="_blank">App Store</a>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="footer-brand">ORDYN</div>
    <div class="footer-tagline">Kill The Noise. Run The System.</div>
  </div>

  <script>
    var SUPABASE_URL = 'https://ltucfeezhsomsyrhroug.supabase.co';
    var SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dWNmZWV6aHNvbXN5cmhyb3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg5NzgzNDUsImV4cCI6MjA2NDU1NDM0NX0.03XrdV09wGyDEzJ1octfAyuM5WVdCIXGWWkatADTLeE';

    var urlParams = new URLSearchParams(window.location.search);
    var shortCode = urlParams.get('code');
    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);

    // On mobile, try to open app IMMEDIATELY (no waiting for Supabase)
    if (isMobile) {
      var deepLink;
      if (shortCode) {
        deepLink = 'ordyn://plan?code=' + encodeURIComponent(shortCode);
      } else if (urlParams.has('p')) {
        deepLink = 'ordyn://plan?' + urlParams.toString();
      }
      if (deepLink) {
        window.location.href = deepLink;
      }
    }

    // Render the web page as fallback (desktop, or if app didn't open)
    if (shortCode) {
      fetch(SUPABASE_URL + '/rest/v1/shared_plans?code=eq.' + encodeURIComponent(shortCode) + '&select=params', {
        headers: { 'apikey': SUPABASE_ANON_KEY, 'Accept': 'application/json' }
      })
      .then(function(r) { return r.json(); })
      .then(function(rows) {
        if (rows[0] && rows[0].params) {
          renderPlan(rows[0].params, shortCode);
        } else {
          document.body.innerHTML = '<p style="color:#666;text-align:center;margin-top:40vh">Plan not found</p>';
        }
      })
      .catch(function() {
        document.body.innerHTML = '<p style="color:#666;text-align:center;margin-top:40vh">Failed to load plan</p>';
      });
    } else {
      renderPlan({
        p: urlParams.get('p') || '', d: urlParams.get('d') || '',
        emin: urlParams.get('emin') || '', emax: urlParams.get('emax') || '',
        sl: urlParams.get('sl') || '', tp: urlParams.get('tp') || '',
        tp2: urlParams.get('tp2') || '', tp3: urlParams.get('tp3') || '',
        pat: urlParams.get('pat') || '', lev: urlParams.get('lev') || '',
        conv: urlParams.get('conv') || '', tf: urlParams.get('tf') || '',
      }, null);
    }

    function renderPlan(data, shortCode) {
      var pair = data.p || '';
      var dir = data.d || '';
      var emin = parseFloat(data.emin || '0');
      var emax = parseFloat(data.emax || '0');
      var sl = parseFloat(data.sl || '0');
      var tp = parseFloat(data.tp || '0');
      var tp2Val = parseFloat(data.tp2 || '0');
      var tp3Val = parseFloat(data.tp3 || '0');
      var pat = data.pat || '';
      var lev = parseFloat(data.lev || '0');
      var conv = parseInt(data.conv || '0', 10);
      var tf = data.tf || '';

      var fmt = function(v) {
        if (!v) return '—';
        return v >= 10
          ? '$' + v.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })
          : '$' + v.toFixed(6);
      };

      // Update page title
      if (pair) document.title = pair + ' ' + (dir === 'L' ? 'Long' : dir === 'S' ? 'Short' : '') + ' Setup — Ordyn';

      // Pair + direction
      document.getElementById('pair').textContent = pair || '—';
      var dirChip = document.getElementById('dirChip');
      if (dir === 'L') {
        dirChip.textContent = 'LONG';
        dirChip.classList.add('dir-long');
      } else if (dir === 'S') {
        dirChip.textContent = 'SHORT';
        dirChip.classList.add('dir-short');
      } else {
        dirChip.classList.add('hidden');
      }

      // Leverage
      var levEl = document.getElementById('levLabel');
      if (lev > 0) { levEl.textContent = lev + 'x'; } else { levEl.classList.add('hidden'); }

      // Pattern
      if (pat) {
        var patSec = document.getElementById('patternSection');
        patSec.classList.remove('hidden');
        document.getElementById('patternName').textContent = pat;
        document.getElementById('patternIcon').style.color = '#F59E0B';
      }

      // Entry zone
      if (emin > 0 || emax > 0) {
        var zoneSec = document.getElementById('zoneSection');
        zoneSec.classList.remove('hidden');
        document.getElementById('zoneMin').textContent = fmt(emin);
        document.getElementById('zoneMax').textContent = fmt(emax || emin);
      }

      // SL / TP / R:R
      if (sl > 0 || tp > 0) {
        document.getElementById('slTpRow').classList.remove('hidden');
        if (sl > 0) document.getElementById('slValue').textContent = fmt(sl);
        else document.getElementById('slCell').classList.add('hidden');
        if (tp > 0) {
          document.getElementById('tpValue').textContent = fmt(tp);
          // Label changes if there are extra TPs
          if (tp2Val > 0) document.getElementById('tpLabel').textContent = 'TP 1';
        } else {
          document.getElementById('tpCell').classList.add('hidden');
        }

        var mid = (emin + (emax || emin)) / 2 || 0;
        if (sl > 0 && tp > 0 && mid > 0) {
          var risk = Math.abs(mid - sl);
          var reward = Math.abs(tp - mid);
          if (risk > 0) {
            var rr = (reward / risk).toFixed(1);
            var rrCellEl = document.getElementById('rrCell');
            rrCellEl.classList.remove('hidden');
            document.getElementById('rrLabel').textContent = '1:' + rr;
            document.getElementById('rrRisk').style.flex = '1';
            document.getElementById('rrReward').style.flex = rr;
          }
        }
      }

      // Extra TPs (TP2, TP3)
      if (tp2Val > 0 || tp3Val > 0) {
        var tpExtraRow = document.getElementById('tpExtraRow');
        tpExtraRow.classList.remove('hidden');
        if (tp2Val > 0) {
          var cell2 = document.createElement('div');
          cell2.className = 'tp-extra-cell';
          cell2.innerHTML = '<div class="tp-extra-label">TP 2</div><div class="tp-extra-value">' + fmt(tp2Val) + '</div>';
          tpExtraRow.appendChild(cell2);
        }
        if (tp3Val > 0) {
          var cell3 = document.createElement('div');
          cell3.className = 'tp-extra-cell';
          cell3.innerHTML = '<div class="tp-extra-label">TP 3</div><div class="tp-extra-value">' + fmt(tp3Val) + '</div>';
          tpExtraRow.appendChild(cell3);
        }
      }

      // Metrics grid
      var metricsData = [];
      if (lev > 1) metricsData.push({ label: 'LEV', value: lev + 'x' });
      var mid2 = (emin + (emax || emin)) / 2 || 0;
      if (sl > 0 && mid2 > 0) {
        var riskPct = Math.abs((sl - mid2) / mid2 * 100 * (lev || 1)).toFixed(1);
        metricsData.push({ label: 'RISK', value: riskPct + '%', color: 'var(--loss)' });
      }
      if (sl > 0 && tp > 0 && mid2 > 0) {
        var risk2 = Math.abs(mid2 - sl);
        var reward2 = Math.abs(tp - mid2);
        if (risk2 > 0) metricsData.push({ label: 'R:R', value: '1:' + (reward2 / risk2).toFixed(1), color: 'var(--profit)' });
      }
      if (metricsData.length > 0) {
        var grid = document.getElementById('metricsGrid');
        grid.classList.remove('hidden');
        metricsData.forEach(function(m) {
          var cell = document.createElement('div');
          cell.className = 'metric-cell';
          cell.innerHTML = '<div class="metric-label">' + m.label + '</div><div class="metric-value" ' + (m.color ? 'style="color:' + m.color + '"' : '') + '>' + m.value + '</div>';
          grid.appendChild(cell);
        });
      }

      // Conviction
      if (conv > 0) {
        var row = document.getElementById('convictionRow');
        row.classList.remove('hidden');
        var dotsEl = document.getElementById('convictionDots');
        var convColor = conv >= 5 ? 'var(--profit)' : conv >= 3 ? 'var(--amber)' : 'var(--loss)';
        var convLabel = conv >= 5 ? 'HIGH' : conv >= 3 ? 'MEDIUM' : 'LOW';
        for (var i = 1; i <= 5; i++) {
          var dot = document.createElement('span');
          dot.className = 'conviction-dot' + (i <= conv ? ' filled' : '');
          dot.style.color = i <= conv ? convColor : '#222';
          dot.textContent = '\u25CF';
          dotsEl.appendChild(dot);
        }
        var valEl = document.getElementById('convictionValue');
        valEl.textContent = convLabel;
        valEl.style.color = convColor;
      }

      // Deep link button
      var btnLink = shortCode
        ? 'ordyn://plan?code=' + encodeURIComponent(shortCode)
        : 'ordyn://plan?' + urlParams.toString();
      document.getElementById('openBtn').href = btnLink;
    }
  </script>
</body>
</html>
