<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Affiliate Dashboard — Ordyn</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#08090C; --card:#0E1117; --cyan:#00D4FF; --text:#F0F0F0; --dim:#8A8F98; --border:rgba(255,255,255,0.08); --green:#10B981; --amber:#F59E0B; }
    html { scroll-behavior: smooth; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, system-ui, sans-serif; line-height: 1.6; }
    body { position: relative; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body::before { content:''; position: fixed; top: -180px; left: 50%; transform: translateX(-50%); width: 760px; height: 560px; background: radial-gradient(ellipse at center, rgba(0,212,255,0.10), transparent 68%); pointer-events: none; z-index: 0; }
    body::after { content:''; position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: 0.018; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); animation: grain 8s steps(10) infinite; }
    @keyframes grain { 0%,100%{transform:translate(0,0)} 10%{transform:translate(-5%,-10%)} 30%{transform:translate(3%,-15%)} 50%{transform:translate(12%,9%)} 70%{transform:translate(9%,4%)} 90%{transform:translate(-1%,7%)} }
    @keyframes fadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:none} }
    .wrap { max-width: 760px; margin: 0 auto; padding: 44px 20px 56px; position: relative; z-index: 1; }
    #content { animation: fadeUp .7s cubic-bezier(.16,1,.3,1) both; }
    .brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; margin-bottom: 22px; }
    .brand img { width: 38px; height: 38px; border-radius: 10px; }
    .brand span { font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 18px; color: var(--text); letter-spacing: 0.5px; }
    .logo { width: 48px; height: 48px; border-radius: 12px; margin-bottom: 18px; display: block; }
    .eyebrow { color: var(--cyan); font-size: 12.5px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 27px; font-weight: 700; margin: 6px 0 4px; }
    .terms { color: var(--dim); font-size: 14px; margin-bottom: 26px; }
    .terms b { color: var(--text); }
    .signout { float: right; background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .linkbox { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; align-items: center; gap: 12px; margin-bottom: 26px; flex-wrap: wrap; }
    .linkbox .label { color: var(--dim); font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; width: 100%; margin-bottom: 2px; }
    .linkbox .url { color: var(--cyan); font-family: 'Space Grotesk', monospace; font-size: 14.5px; font-weight: 600; flex: 1; min-width: 200px; word-break: break-all; }
    .copy { background: var(--cyan); color: #000; border: none; border-radius: 8px; padding: 9px 16px; font-size: 13px; font-weight: 700; font-family: inherit; cursor: pointer; }
    .copy.done { background: var(--green); color: #fff; }
    .cards { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 28px; }
    @media (max-width: 620px) { .cards { grid-template-columns: repeat(2, 1fr); } }
    .stat { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px 16px; }
    .stat .v { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.1; }
    .stat .v.green { color: var(--green); } .stat .v.amber { color: var(--amber); }
    .stat .k { color: var(--dim); font-size: 12px; margin-top: 4px; }
    h2 { font-size: 14px; font-weight: 700; margin: 0 0 12px; }
    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 600; padding: 0 8px 8px; }
    td { font-size: 13.5px; padding: 11px 8px; border-top: 1px solid var(--border); }
    .pill { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 999px; text-transform: capitalize; }
    .pill.pending { background: rgba(245,158,11,0.12); color: var(--amber); }
    .pill.paid { background: rgba(16,185,129,0.12); color: var(--green); }
    .pill.refunded { background: rgba(255,255,255,0.08); color: var(--dim); }
    .empty { background: var(--card); border: 1px dashed var(--border); border-radius: 14px; padding: 32px; text-align: center; color: var(--dim); font-size: 14px; }
    /* login */
    .login { max-width: 400px; margin: 40px auto 0; text-align: center; }
    .login h1 { font-size: 24px; }
    .login p { color: var(--dim); font-size: 14.5px; margin-bottom: 22px; }
    .login input { width: 100%; background: var(--card); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; color: var(--text); font-size: 15px; font-family: inherit; margin-bottom: 12px; }
    .login input:focus { outline: none; border-color: var(--cyan); }
    .login button { width: 100%; background: var(--cyan); color: #000; border: none; border-radius: 11px; padding: 14px; font-size: 15px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 0 24px rgba(0,212,255,0.22); transition: box-shadow .25s, transform .1s; }
    .login button:hover { box-shadow: 0 0 38px rgba(0,212,255,0.42); }
    .login button:active { transform: translateY(1px); }
    .login button:disabled { opacity: 0.6; box-shadow: none; }
    .oauth { width: 100%; background: #fff; color: #1a1a1a; border: none; border-radius: 11px; padding: 13px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .oauth svg { width: 18px; height: 18px; }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; margin: 16px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .notice { background: rgba(0,212,255,0.06); border: 1px solid rgba(0,212,255,0.18); border-radius: 12px; padding: 18px; color: var(--text); font-size: 14.5px; }
    .foot { color: #4A4F5A; font-size: 12px; margin-top: 30px; }
    .foot a { color: var(--dim); }
    .state { text-align: center; padding: 80px 20px; color: var(--dim); }
  </style>
</head>
<body>
  <div class="wrap">
    <a href="/" class="brand"><img src="/app-icon.png" alt="Ordyn"><span>ORDYN</span></a>
    <div id="content"><div class="state">Loading…</div></div>
    <p class="foot">Payouts are issued monthly (US$50 min, 30-day clearing). <a href="/affiliate-terms">Affiliate Terms</a> · Questions? <a href="mailto:support@ordyn.io">support@ordyn.io</a> · <a href="/">ordyn.io</a></p>
  </div>

  <script>
    var SUPABASE_URL = 'https://ltucfeezhsomsyrhroug.supabase.co';
    var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dWNmZWV6aHNvbXN5cmhyb3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg5NzgzNDUsImV4cCI6MjA2NDU1NDM0NX0.03XrdV09wGyDEzJ1octfAyuM5WVdCIXGWWkatADTLeE';
    var sb = supabase.createClient(SUPABASE_URL, ANON, { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
    var el = document.getElementById('content');
    var GOOGLE_SVG = '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';

    function money(c) { return '$' + (((c || 0) / 100)).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 }); }
    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }
    function fmtDate(s) { try { return new Date(s).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }); } catch (e) { return ''; } }

    function renderLogin(sent, email) {
      if (sent) {
        el.innerHTML = '<div class="login"><div class="eyebrow">Affiliate login</div><h1>Check your email 📬</h1>' +
          '<div class="notice">We sent a login link to <b>' + esc(email) + '</b>. Click it to open your dashboard. The link expires in 24 hours.</div></div>';
        return;
      }
      el.innerHTML = '<div class="login"><div class="eyebrow">Affiliate login</div><h1>Your affiliate dashboard</h1>' +
        '<p>Enter the email you registered as an Ordyn affiliate. We’ll email you a secure login link — no password needed.</p>' +
        '<input id="email" type="email" placeholder="you@example.com" autocomplete="email" />' +
        '<button id="send">Email me a login link</button>' +
        '<p id="err" style="color:#EF4444;min-height:18px;margin-top:10px"></p></div>';
      document.getElementById('send').onclick = sendLink;
      document.getElementById('email').addEventListener('keydown', function (e) { if (e.key === 'Enter') sendLink(); });
    }

    function sendLink() {
      var email = (document.getElementById('email').value || '').trim();
      var err = document.getElementById('err');
      if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) { err.textContent = 'Enter a valid email.'; return; }
      var btn = document.getElementById('send'); btn.disabled = true; btn.textContent = 'Sending…';
      sb.auth.signInWithOtp({ email: email, options: { emailRedirectTo: location.origin + '/affiliate' } })
        .then(function (r) {
          if (r.error) { err.textContent = r.error.message; btn.disabled = false; btn.textContent = 'Send login link'; }
          else renderLogin(true, email);
        });
    }

    function renderNotAffiliate() {
      el.innerHTML = '<div class="login"><div class="eyebrow">Affiliate login</div><h1>Not an affiliate yet</h1>' +
        '<div class="notice">This email isn’t registered as an Ordyn affiliate. Want to join? <a href="/become-an-affiliate" style="color:var(--cyan)">Apply here</a>.</div>' +
        '<button id="out" style="margin-top:16px;background:none;border:1px solid var(--border);color:var(--dim)">Sign out</button></div>';
      document.getElementById('out').onclick = function () { sb.auth.signOut().then(boot); };
    }

    function renderDashboard(d) {
      var link = 'ordyn.io/upgrade?via=' + d.code;
      var rows = (d.recent || []).map(function (r) {
        return '<tr><td>' + fmtDate(r.occurred_at) + '</td><td style="text-transform:capitalize">' + esc(r.kind) + (r.plan ? ' · ' + esc(r.plan) : '') + '</td><td>' + money(r.commission_cents) + '</td><td><span class="pill ' + esc(r.status) + '">' + esc(r.status) + '</span></td></tr>';
      }).join('');
      var table = rows
        ? '<table><thead><tr><th>Date</th><th>Type</th><th>Your commission</th><th>Status</th></tr></thead><tbody>' + rows + '</tbody></table>'
        : '<div class="empty">No referrals yet. Share your link and your first commissions will show up here automatically.</div>';
      el.innerHTML =
        '<button class="signout" id="out">Sign out</button>' +
        '<div class="eyebrow">Affiliate dashboard</div><h1>Hi ' + esc(d.name) + ' 👋</h1>' +
        '<p class="terms">You earn <b>' + d.commission_pct + '%</b> on everything your referrals pay in their first year, then <b>' + (d.residual_pct != null ? d.residual_pct : 15) + '%</b> every year after — for as long as they stay subscribed. Lifetime sign-ups pay <b>' + d.commission_pct + '%</b> once.</p>' +
        '<div class="linkbox"><div class="label">Your referral link</div>' +
          '<div class="url" id="lnk">' + link + '</div><button class="copy" id="copy">Copy link</button></div>' +
        '<div class="cards">' +
          '<div class="stat"><div class="v">' + (d.paying_customers || 0) + '</div><div class="k">Paying customers</div></div>' +
          '<div class="stat"><div class="v green">' + money(d.earned_total_cents) + '</div><div class="k">Total earned</div></div>' +
          '<div class="stat"><div class="v amber">' + money(d.earned_pending_cents) + '</div><div class="k">Pending payout</div></div>' +
          '<div class="stat"><div class="v">' + money(d.earned_paid_cents) + '</div><div class="k">Paid out</div></div>' +
        '</div><h2>Recent activity</h2>' + table;
      document.getElementById('out').onclick = function () { sb.auth.signOut().then(boot); };
      document.getElementById('copy').onclick = function () {
        navigator.clipboard.writeText('https://' + link).then(function () {
          var b = document.getElementById('copy'); b.textContent = '✓ Copied'; b.classList.add('done');
        });
      };
    }

    function boot() {
      el.innerHTML = '<div class="state">Loading…</div>';
      sb.auth.getSession().then(function (r) {
        if (!r.data.session) { renderLogin(false); return; }
        sb.rpc('get_my_affiliate_stats').then(function (res) {
          if (res.error) { el.innerHTML = '<div class="state">Couldn’t load your dashboard. Try again shortly.</div>'; return; }
          var d = res.data;
          if (!d || d.found === false) { renderNotAffiliate(); return; }
          renderDashboard(d);
        });
      });
    }

    // Handle the magic-link return, then boot.
    sb.auth.onAuthStateChange(function (_e, _s) {});
    boot();
  </script>
</body>
</html>
