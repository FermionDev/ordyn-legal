<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>You're In — Ordyn</title>
  <meta name="robots" content="noindex">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B0E11;
      color: #fff;
      font-family: 'Manrope', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .wrap { max-width: 480px; }
    .icon { font-size: 48px; margin-bottom: 20px; }
    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 32px;
      margin-bottom: 12px;
      color: #00D4FF;
    }
    p { color: #A3A3A3; font-size: 16px; line-height: 1.7; margin-bottom: 28px; }
    a {
      display: inline-block;
      padding: 12px 28px;
      background: #00D4FF;
      color: #0B0E11;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
      font-family: 'Space Grotesk', sans-serif;
      transition: opacity 0.2s;
    }
    a:hover { opacity: 0.85; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">&#x1F389;</div>
    <h1>You're on the list!</h1>
    <p>We'll reach out when your early access is ready. In the meantime, join the community on Discord.</p>
    <a href="https://discord.gg/NqchGpsCeC">Join Discord</a>
  </div>
</body>
</html>
