<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/site.webmanifest">
  <title>Affiliate Admin — Ordyn</title>
  <meta name="robots" content="noindex">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg:#08090C; --card:#0E1117; --cyan:#00D4FF; --text:#F0F0F0; --dim:#8A8F98; --border:rgba(255,255,255,0.08); --green:#10B981; --amber:#F59E0B; }
    html, body { background: var(--bg); color: var(--text); font-family: 'Inter', system-ui, sans-serif; line-height: 1.55; }
    body { position: relative; overflow-x: hidden; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    body::before { content:''; position: fixed; top: -200px; left: 50%; transform: translateX(-50%); width: 820px; height: 560px; background: radial-gradient(ellipse at center, rgba(0,212,255,0.08), transparent 68%); pointer-events: none; z-index: 0; }
    body::after { content:''; position: fixed; inset: 0; z-index: 999; pointer-events: none; opacity: 0.015; background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E"); }
    .wrap { max-width: 840px; margin: 0 auto; padding: 40px 20px 60px; position: relative; z-index: 1; }
    .eyebrow { color: var(--cyan); font-size: 12px; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; margin: 4px 0 22px; }
    .signout { float: right; background: none; border: 1px solid var(--border); color: var(--dim); border-radius: 8px; padding: 6px 12px; font-size: 12px; cursor: pointer; font-family: inherit; }
    .sec { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 18px; }
    .sec h2 { font-size: 15px; margin-bottom: 14px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
    input, button { font-family: inherit; }
    input { width: 100%; background: #0B0E11; border: 1px solid var(--border); border-radius: 9px; padding: 10px 12px; color: var(--text); font-size: 14px; }
    input:focus { outline: none; border-color: var(--cyan); }
    .btn { background: var(--cyan); color: #000; border: none; border-radius: 9px; padding: 10px 16px; font-size: 13.5px; font-weight: 700; cursor: pointer; }
    .btn.sm { padding: 6px 11px; font-size: 12px; }
    .btn.ghost { background: none; border: 1px solid var(--border); color: var(--dim); }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { text-align: left; color: var(--dim); font-size: 11px; text-transform: uppercase; padding: 0 8px 8px; }
    td { padding: 10px 8px; border-top: 1px solid var(--border); vertical-align: middle; }
    .amt { color: var(--amber); font-weight: 600; }
    .amt.paid { color: var(--green); }
    .muted { color: var(--dim); }
    .empty { color: var(--dim); font-size: 14px; padding: 8px 0; }
    .login { max-width: 380px; margin: 60px auto; text-align: center; }
    .login input { margin: 14px 0; } .login .btn { width: 100%; }
    .oauth { width: 100%; background: #fff; color: #1a1a1a; border: none; border-radius: 9px; padding: 12px; font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; }
    .oauth svg { width: 18px; height: 18px; }
    .divider { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; margin: 16px 0; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
    .err { color: #EF4444; font-size: 13px; min-height: 16px; }
    .row-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <div class="wrap"><div id="app"><div class="login"><p class="muted">Loading…</p></div></div></div>
  <script>
    var sb = supabase.createClient('https://ltucfeezhsomsyrhroug.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imx0dWNmZWV6aHNvbXN5cmhyb3VnIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NDg5NzgzNDUsImV4cCI6MjA2NDU1NDM0NX0.03XrdV09wGyDEzJ1octfAyuM5WVdCIXGWWkatADTLeE', { auth: { flowType: 'implicit', detectSessionInUrl: true, persistSession: true, autoRefreshToken: true } });
    var app = document.getElementById('app');
    var GOOGLE_SVG = '<svg viewBox="0 0 48 48" xmlns="http://www.w3.org/2000/svg"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>';
    function money(c){return '$'+(((c||0)/100)).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}
    function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c];});}

    function loginView(sent, email){
      if(sent){ app.innerHTML='<div class="login"><div class="eyebrow">Admin</div><h1>Check your email</h1><p class="muted">Login link sent to '+esc(email)+'.</p></div>'; return; }
      app.innerHTML='<div class="login"><div class="eyebrow">Admin</div><h1>Affiliate admin</h1>'+
        '<input id="email" type="email" placeholder="admin email"/><button class="btn" id="send">Email me a login link</button><p class="err" id="err"></p></div>';
      document.getElementById('send').onclick=function(){
        var em=document.getElementById('email').value.trim();
        if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(em)){document.getElementById('err').textContent='Valid email please.';return;}
        sb.auth.signInWithOtp({email:em,options:{emailRedirectTo:location.origin+'/admin/affiliates'}}).then(function(r){
          if(r.error)document.getElementById('err').textContent=r.error.message; else loginView(true,em);
        });
      };
    }

    function notAdmin(){ app.innerHTML='<div class="login"><h1>Not authorized</h1><p class="muted">This account is not an admin.</p><button class="btn ghost" onclick="sb.auth.signOut().then(boot)" style="margin-top:14px">Sign out</button></div>'; }

    function render(affs, apps){
      var appsRows = apps.map(function(a){
        return '<tr><td>'+esc(a.name)+'<div class="muted">'+esc(a.email)+'</div></td>'+
          '<td>'+esc(a.platform||'—')+'<div class="muted">'+esc(a.handle||'')+' · '+esc(a.audience||'')+'</div></td>'+
          '<td class="row-actions"><button class="btn sm" onclick="approve('+a.id+')">Approve</button>'+
          '<button class="btn sm ghost" onclick="decide('+a.id+",''"+',false)">Decline</button></td></tr>';
      }).join('');
      var affRows = affs.map(function(a){
        return '<tr><td>'+esc(a.name)+(a.active?'':' <span class="muted">(inactive)</span>')+'<div class="muted">via='+esc(a.code)+'</div></td>'+
          '<td>'+a.paying+'</td><td class="amt">'+money(a.pending_cents)+'</td><td class="amt paid">'+money(a.paid_cents)+'</td>'+
          '<td class="row-actions">'+(a.pending_cents>0?'<button class="btn sm" onclick="markPaid(\''+a.code+'\','+a.pending_cents+')">Mark paid</button>':'')+
          '<button class="btn sm ghost" onclick="toggle(\''+a.code+'\','+(!a.active)+')">'+(a.active?'Disable':'Enable')+'</button></td></tr>';
      }).join('');
      app.innerHTML =
        '<button class="signout" onclick="sb.auth.signOut().then(boot)">Sign out</button>'+
        '<div class="eyebrow">Admin</div><h1>Affiliate admin</h1>'+
        '<div class="sec"><h2>Pending applications ('+apps.length+')</h2>'+
          (apps.length?'<table><thead><tr><th>Applicant</th><th>Channel</th><th></th></tr></thead><tbody>'+appsRows+'</tbody></table>':'<div class="empty">No pending applications.</div>')+'</div>'+
        '<div class="sec"><h2>Add affiliate</h2><div class="grid">'+
          '<input id="a_code" placeholder="code (e.g. alice)"/><input id="a_name" placeholder="name"/>'+
          '<input id="a_email" placeholder="email"/><input id="a_payout" placeholder="payout handle (wise/paypal)"/>'+
          '<input id="a_pct" placeholder="first-yr % (30)" value="30"/><input id="a_residual" placeholder="residual % (15)" value="15"/>'+
          '<input id="a_months" placeholder="full-rate months (12)" value="12"/>'+
          '</div><button class="btn" style="margin-top:10px" onclick="addAff()">Add affiliate</button><p class="err" id="a_err"></p></div>'+
        '<div class="sec"><h2>Affiliates ('+affs.length+')</h2>'+
          (affs.length?'<table><thead><tr><th>Affiliate</th><th>Paying</th><th>Owed</th><th>Paid</th><th></th></tr></thead><tbody>'+affRows+'</tbody></table>':'<div class="empty">No affiliates yet.</div>')+'</div>';
    }

    function load(){
      Promise.all([sb.rpc('admin_affiliates'), sb.rpc('admin_applications')]).then(function(rs){
        if(rs[0].error){ notAdmin(); return; }
        render(rs[0].data||[], rs[1].data||[]);
      });
    }
    window.markPaid=function(code,cents){ if(!confirm('Mark '+money(cents)+' paid for '+code+'? Do this AFTER you send the payout.'))return; sb.rpc('admin_mark_paid',{p_code:code}).then(load); };
    window.toggle=function(code,active){ sb.rpc('admin_set_affiliate_active',{p_code:code,p_active:active}).then(load); };
    window.addAff=function(){
      var pct=parseFloat(document.getElementById('a_pct').value)||30, months=parseInt(document.getElementById('a_months').value)||12;
      var residual=parseFloat(document.getElementById('a_residual').value); if(isNaN(residual))residual=15;
      var code=document.getElementById('a_code').value.trim(), name=document.getElementById('a_name').value.trim(), email=document.getElementById('a_email').value.trim();
      if(!code||!name||!email){document.getElementById('a_err').textContent='code, name, email required';return;}
      sb.rpc('admin_add_affiliate',{p_code:code,p_name:name,p_email:email,p_payout:document.getElementById('a_payout').value.trim()||null,p_pct:pct,p_months:months,p_residual:residual}).then(function(r){
        if(r.error)document.getElementById('a_err').textContent=r.error.message; else load();
      });
    };
    window.approve=function(id){ var code=prompt('Affiliate code for this applicant (e.g. alice):'); if(!code)return; sb.rpc('admin_decide_application',{p_id:id,p_code:code.trim().toLowerCase(),p_approve:true}).then(load); };
    window.decide=function(id){ if(!confirm('Decline this application?'))return; sb.rpc('admin_decide_application',{p_id:id,p_code:'',p_approve:false}).then(load); };

    window.boot=function(){
      sb.auth.getSession().then(function(r){ if(!r.data.session) loginView(false); else load(); });
    };
    boot();
  </script>
</body>
</html>
